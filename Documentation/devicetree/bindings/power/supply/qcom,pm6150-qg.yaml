%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm6150-qg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM6150 QGauge fuel gauge

maintainers:
  - Sebastian Reichel <sre@kernel.org>

description: |
  The QGauge block in PM6150 measures battery voltage and current and captures
  open-circuit voltage samples used by software to estimate state of charge.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: qcom,pm6150-qg

  reg:
    maxItems: 1

  interrupts:
    minItems: 5
    maxItems: 5

  interrupt-names:
    items:
      - const: qg-batt-missing
      - const: qg-vbat-low
      - const: qg-vbat-empty
      - const: qg-fifo-done
      - const: qg-good-ocv

  io-channels:
    maxItems: 1

  io-channel-names:
    items:
      - const: batt-therm

  monitored-battery: true

  power-supplies: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery
  - power-supplies

unevaluatedProperties: false
...
