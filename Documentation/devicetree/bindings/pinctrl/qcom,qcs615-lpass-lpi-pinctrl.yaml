%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/qcom,qcs615-lpass-lpi-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm QCS615 LPASS LPI pin controller

maintainers:
  - Yassin Rezai <yassinrsocial@proton.me>

properties:
  compatible:
    const: qcom,qcs615-lpass-lpi-pinctrl

  reg:
    items:
      - description: LPASS LPI TLMM Control and Status registers

  clocks:
    items:
      - description: LPASS core hardware vote

  clock-names:
    items:
      - const: core

patternProperties:
  "-state$":
    oneOf:
      - $ref: "#/$defs/qcom-qcs615-lpass-state"
      - patternProperties:
          "-pins$":
            $ref: "#/$defs/qcom-qcs615-lpass-state"
        additionalProperties: false

$defs:
  qcom-qcs615-lpass-state:
    type: object
    $ref: qcom,lpass-lpi-common.yaml#/$defs/qcom-tlmm-state
    unevaluatedProperties: false
    properties:
      pins:
        items:
          pattern: "^gpio([0-9]|1[0-9]|2[0-9]|3[0-1])$"
      function:
        enum: [gpio, dmic1_clk, dmic1_data, dmic2_clk, dmic2_data,
               swr_tx_clk, swr_tx_data, swr_rx_clk, swr_rx_data,
               lpi_cdc_rst]

allOf:
  - $ref: qcom,lpass-lpi-common.yaml#

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/sound/qcom,q6dsp-lpass-ports.h>

    lpass_tlmm: pinctrl@62b40000 {
        compatible = "qcom,qcs615-lpass-lpi-pinctrl";
        reg = <0x62b40000 0x20000>;
        clocks = <&q6afecc LPASS_HW_MACRO_VOTE LPASS_CLK_ATTRIBUTE_COUPLE_NO>;
        clock-names = "core";
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&lpass_tlmm 0 0 32>;

        rx-swr-state {
            rx-clk-pins {
                pins = "gpio21";
                function = "swr_rx_clk";
            };
            rx-data-pins {
                pins = "gpio22", "gpio23";
                function = "swr_rx_data";
            };
        };
    };
