%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt37706.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT37706 based AMOLED DSI panels

maintainers:
  - Yassin Rezai <yassinrsocial@proton.me>

description:
  The Novatek NT37706 is a display driver IC for AMOLED DSI panels using
  Display Stream Compression. The panel specific compatible selects the
  initialization sequence.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - enum:
          - xiaomi,peridot-csot-nt37706
      - const: novatek,nt37706

  reg:
    maxItems: 1
    description: DSI virtual channel

  vddio-supply:
    description: 1.8V I/O supply

  vdd-supply:
    description: 1.2V digital core supply

  vci-supply:
    description: 3.0V analog supply

  port: true
  reset-gpios: true

required:
  - compatible
  - reg
  - vddio-supply
  - vdd-supply
  - vci-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "xiaomi,peridot-csot-nt37706", "novatek,nt37706";
            reg = <0>;

            vddio-supply = <&vreg_l8b_1p8>;
            vdd-supply = <&panel_vdd_1p2>;
            vci-supply = <&vreg_l19b_3p0>;

            reset-gpios = <&tlmm 13 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
...
